name: Bump Homebrew tap

# A tag replaces the tap's formula with packaging/autoreview.rb, pointed at
# the tag's tarball. The formula lives here, so a change to how the binary
# is built ships with the change that needs it.
#
# HOMEBREW_TAP_TOKEN is a secret of the organization, so a tag pushed in any
# copy of this repo could replace the formula. The job runs only in the repo
# the formula's url names: a tag in a copy would point the public formula at
# that copy's tarball.

on:
  push:
    tags:
      - "v*"

jobs:
  bump:
    if: github.repository == 'venabots/autoreview'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: source
      - uses: actions/checkout@v7
        with:
          repository: venabots/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Write the formula
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tarball="https://github.com/${REPO}/archive/refs/tags/${TAG}.tar.gz"
          # GitHub can serve the archive a few seconds after the tag event.
          sha=$(curl --retry 6 --retry-delay 5 --retry-all-errors -sfL "$tarball" | shasum -a 256 | cut -d' ' -f1)
          [[ -n "$sha" ]] || { echo "could not read the tarball"; exit 1; }
          sed \
            -e "s|^  url .*|  url \"$tarball\"|" \
            -e "s|^  sha256 .*|  sha256 \"$sha\"|" \
            source/packaging/autoreview.rb >tap/Formula/autoreview.rb
      - name: Commit and push
        env:
          TAG: ${{ github.ref_name }}
        working-directory: tap
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/autoreview.rb
          if git diff --cached --quiet; then
            echo "the formula is unchanged"
            exit 0
          fi
          git commit -m "autoreview: bump to ${TAG#v}"
          git push
