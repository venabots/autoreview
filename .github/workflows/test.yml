name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macOS is the primary target. Linux catches what quietly depended
        # on it: the two differ in how a terminal's input is flushed.
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      # The end-to-end tests start the test binary itself as gh and dash-p,
      # dozens of times. With the race detector each start takes a second,
      # so that package runs without it. The engine it drives is raced below.
      - name: Test
        run: go test -race $(go list ./... | grep -v /cmd/)
      - name: Test end to end
        run: go test ./cmd/...
      - name: Build
        run: go build -o autoreview ./cmd/autoreview

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
